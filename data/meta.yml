indicator:
  name: Great Lakes Ice Cover
  slug: great-lakes-ice-cover
  publisher: U.S. Environmental Protection Agency
  source_page: https://19january2025snapshot.epa.gov/climate-indicators/climate-change-indicators-great-lakes-ice-cover/index.html
  technical_documentation: https://19january2025snapshot.epa.gov/sites/default/files/2021-04/documents/great-lakes-ice_td.pdf
  rights: Public domain, work of the U.S. Government (17 U.S.C. 105)
datasets:
- file: great_lakes_ice_max_cover.csv
  figure: Figure 1
  figure_title: Figure 1. Maximum Ice-Covered Area in the Great Lakes, 1973–2020
  source_file: great-lakes-ice_fig-1.csv
  source_sha256: 088e4e0a98940370d315b8eecc72b5854c8bc826e39c52b5195e329495b7a57a
  source_encoding: UTF-8-BOM
  data_source: NOAA, 2021
  web_update: April 2021
  unit: maximum percent ice cover
  rows: 288
  columns:
  - name: year
    type: integer
    description: Year as EPA labels it.
  - name: lake
    type: string
    description: Lake name as EPA's header prints it (Erie, Huron, Michigan, Ontario,
      Superior), or All Lakes for the five combined.
  - name: value
    type: number
    description: Maximum percent ice cover that year, as published.
- file: great_lakes_ice_duration.csv
  figure: Figure 2
  figure_title: Figure 2. Duration of Ice Cover in the Great Lakes, 1973–2020
  source_file: great-lakes-ice_fig-2.csv
  source_sha256: e141df51e2a59dbc23f55bd680f2d891bf8295794a7d4191fe28e68093abb6c5
  source_encoding: UTF-8-BOM
  data_source: NOAA, 2021
  web_update: April 2021
  unit: number of days with more than 5% ice cover
  rows: 240
  columns:
  - name: year
    type: integer
    description: Year as EPA labels it.
  - name: lake
    type: string
    description: Lake name as EPA's header prints it (Erie, Huron, Michigan, Ontario,
      Superior).
  - name: value
    type: integer
    description: Number of days that year with more than 5% ice cover, as published.
